<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monéta — Open Portal</title>
<meta name="description" content="Monéta. A key-gated crypto portal.">
<meta name="theme-color" content="#05040a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305040a'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='800' fill='%23b14dff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/gate.css">
</head>
<body>

<div class="field"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>

<main class="gate" id="gate">
  <div class="gate-inner">

    <div class="sigil">
      <div class="sigil-ring"></div>
      <div class="sigil-ring r2"></div>
      <svg viewBox="0 0 100 100" aria-label="Monéta sigil" role="img">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e9d5ff"/>
            <stop offset="0.5" stop-color="#b14dff"/>
            <stop offset="1" stop-color="#5b21b6"/>
          </linearGradient>
          <filter id="sgGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#sgGlow)">
          <path d="M50 6 L88 28 L88 72 L50 94 L12 72 L12 28 Z"
                fill="none" stroke="url(#sg)" stroke-width="2.4" opacity=".55"/>
          <path d="M50 18 L77 34 L77 66 L50 82 L23 66 L23 34 Z"
                fill="rgba(177,77,255,.07)" stroke="url(#sg)" stroke-width="1.3" opacity=".7"/>
          <path d="M32 66 V38 L50 56 L68 38 V66" fill="none" stroke="url(#sg)"
                stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="2.6" fill="#e9d5ff"/>
        </g>
      </svg>
    </div>

    <h1 class="wordmark">Mon&eacute;ta</h1>
    <p class="tagline">Private Asset Terminal</p>

    <div class="hairline"></div>

    <section class="keycard">
      <h2>Open Portal</h2>
      <p class="sub">This terminal is sealed. Enter your access key to continue.</p>

      <form id="keyForm" autocomplete="off" novalidate>
        <div class="key-field" id="keyField">
          <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="keyInput" type="password" placeholder="ACCESS KEY"
                 spellcheck="false" autocapitalize="none" aria-label="Access key">
          <button type="button" class="reveal" id="revealBtn" aria-label="Show key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary" id="openBtn">OPEN PORTAL</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>

      <p class="hint">Key for this build: <code>SlimeGeo</code></p>
    </section>

    <div class="ticker-strip" id="strip"></div>
  </div>
</main>

<div class="footnote">Monéta · Simulated market data · No real funds</div>

<script src="assets/js/coins.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/market.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/gate.js"></script>
</body>
</html>
